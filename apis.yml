aid: mind-foundry
name: Mind Foundry
description: >-
  Mind Foundry is an Oxford University spin-out, founded in 2016 and headquartered at Ewert
  House in Oxford, United Kingdom, that builds applied machine learning for high-stakes,
  real-world problems across defence, national security, insurance, infrastructure and
  government. Its current products are SENTRY, a multi-modal sensor-fusion capability that
  detects, classifies and tracks objects in time and space from raw sensor data, and
  NIGHTINGALE, AI-enabled acoustic intelligence for anti-submarine warfare that has been
  integrated with Thales systems. Mind Foundry delivers these as deployed and integrated
  systems for customers and prime contractors rather than as a public, self-serve developer
  API, and it publishes no developer portal, API reference or machine-readable specification.
  The company previously operated OPTaaS (Optimization as a Service), a Bayesian optimisation
  API with first-party Python and R clients; the OPTaaS service hosts and its GitHub client
  repositories are no longer reachable, and the PyPI client has had no release since
  January 2024. Mind Foundry publishes ISO 27001, Cyber Essentials Plus and JOSCAR
  certifications on its own site.
